  parameters: {}
paths:
  /org/{orgId}/role:
    put:
      description: Create a role.
      tags:
        - Role
      security:
        - Bearer Auth: []
      parameters:
        - schema:
            type: string
          required: true
          name: orgId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                description:
                  type: string
                requireDeviceApproval:
                  type: boolean
                allowSsh:
                  type: boolean
                sshSudoMode:
                  type: string
                  enum:
                    - none
                    - full
                    - commands
                sshSudoCommands:
                  type: array
                  items:
                    type: string
                sshCreateHomeDir:
                  type: boolean
                sshUnixGroups:
                  type: array
                  items:
                    type: string
              required:
                - name
              additionalProperties: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    nullable: true
                    additionalProperties:
                      nullable: true
                  success:
                    type: boolean
                  error:
                    type: boolean
                  message:
                    type: string
                  status:
                    type: number
                required:
                  - data
                  - success
                  - error
                  - message
                  - status
  /target/{targetId}:
    get:
      description: Get a target.
      tags:
        - Resource Target
      security:
        - Bearer Auth: []
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
          required: true
          name: targetId
