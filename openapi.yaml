      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
          required: true
          name: targetId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                siteId:
                  type: integer
                  minimum: 0
                  exclusiveMinimum: true
                ip:
                  type: string
                mode:
                  type: string
                  nullable: true
                  enum:
                    - http
                    - tcp
                    - udp
                    - ssh
                    - rdp
                    - vnc
                    - null
                method:
                  type: string
                  nullable: true
                  minLength: 1
                  maxLength: 10
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                enabled:
                  type: boolean
                hcEnabled:
                  type: boolean
                  nullable: true
                hcPath:
                  type: string
                  nullable: true
                  minLength: 1
                hcScheme:
                  type: string
                  nullable: true
                hcMode:
                  type: string
                  nullable: true
                hcHostname:
                  type: string
                  nullable: true
                hcPort:
                  type: integer
                  nullable: true
                  minimum: 0
                  exclusiveMinimum: true
                hcInterval:
