                        type: string
                      lastChars:
                        type: string
                      createdAt:
                        type: string
                      lastUsed:
                        type: string
                        nullable: true
                      maxBatchSize:
                        type: number
                        nullable: true
                      numUsed:
                        type: number
                      validUntil:
                        type: string
                        nullable: true
                      approveNewSites:
