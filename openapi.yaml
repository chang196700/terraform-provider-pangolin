  - name: Public Resource
  - name: Resource Target
  - name: Private Resource
  - name: Client
  - name: Organization
  - name: Domain
  - name: Public Resource Policy
  - name: Role
  - name: User
  - name: Rule
  - name: User Invitation
  - name: Access Token
  - name: Identity Provider (Global)
  - name: Identity Provider (Organization Only)
